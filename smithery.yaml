# Smithery configuration for ANP: Instalações do SIMP
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_anp_instalacoes_simp

name: anp_instalacoes_simp-mcp
displayName: "ANP: Instalações do SIMP"
description: >
  ANP: Instalações do SIMP, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/anp_instalacoes_simp-mcp
repository: https://github.com/mcp-dir/anp_instalacoes_simp-mcp

tags:
  - anp_instalacoes_simp
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_anp_instalacoes_simp

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_anp_instalacoes_simp/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
